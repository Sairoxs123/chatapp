<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ username }} - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .scroll-container {
            scrollbar-width: thin;
            scrollbar-color: rgba(156, 163, 175, 0.5) transparent;
        }
        .scroll-container::-webkit-scrollbar {
            width: 6px;
        }
        .scroll-container::-webkit-scrollbar-track {
            background: transparent;
        }
        .scroll-container::-webkit-scrollbar-thumb {
            background-color: rgba(156, 163, 175, 0.5);
            border-radius: 3px;
        }
    </style>
</head>
<body class="bg-gray-900 text-white min-h-screen">
    <!-- Header -->
    <nav class="bg-gray-800 border-b border-gray-700 fixed w-full top-0 z-10">
        <div class="container mx-auto px-4 py-4">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-4">
                    <img src="{{ url }}" alt="{{ username }}" class="w-12 h-12 rounded-full">
                    <div>
                        <h1 class="text-2xl font-bold">{{ username }}</h1>
                        <p class="text-sm text-gray-400">{{ email }}</p>
                    </div>
                </div>
                <a href="{% url 'logout' %}" class="flex items-center space-x-2 px-4 py-2 bg-red-600 hover:bg-red-700 rounded-lg transition">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
                    </svg>
                    <span>Logout</span>
                </a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container mx-auto px-4 pt-24 pb-8">
        <div class="max-w-4xl mx-auto">
            <!-- Search Bar -->
            <div class="mb-8">
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                        </svg>
                    </div>
                    <input type="search" id="search" placeholder="Search for users..." 
                        class="w-full pl-10 pr-4 py-3 bg-gray-800 border border-gray-700 rounded-lg focus:outline-none focus:border-blue-500 transition">
                </div>
            </div>

            <!-- Create Group Button -->
            <div class="mb-6">
                <a href="{% url 'create-group' %}" class="inline-flex items-center space-x-2 px-6 py-3 bg-blue-600 hover:bg-blue-700 rounded-lg font-semibold transition">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                    </svg>
                    <span>Create Group</span>
                </a>
            </div>

            <!-- Users Grid -->
            <div class="grid gap-4 md:grid-cols-2 lg:grid-cols-3" id="users-grid">
                {% for i in users %}
                    {% if i.username != username %}
                    <a href="/main/chat/direct/{{i.id}}" class="block bg-gray-800 hover:bg-gray-750 rounded-lg p-4 border border-gray-700 hover:border-blue-500 transition group">
                        <div class="flex items-center space-x-4">
                            <img src="{{ i.photo.url }}" alt="{{ i.username }}" class="w-16 h-16 rounded-full border-2 border-gray-700 group-hover:border-blue-500 transition">
                            <div class="flex-1">
                                <h3 class="font-semibold text-lg">{{ i.username }}</h3>
                                <p class="text-sm text-gray-400">Click to chat</p>
                            </div>
                            <svg class="w-6 h-6 text-gray-600 group-hover:text-blue-500 transition" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                            </svg>
                        </div>
                    </a>
                    {% endif %}
                {% endfor %}
            </div>
        </div>
    </div>

    <script>
        // Search functionality
        let allUsers = {{ users|safe }};  // Cache original users
        
        document.getElementById('search').addEventListener('input', function(e) {
            const query = e.target.value;
            
            if (!query) {
                // Restore original users from cache
                const usersGrid = document.getElementById('users-grid');
                usersGrid.innerHTML = '';
                
                {% for i in users %}
                    {% if i.username != username %}
                    const userDiv = document.createElement('a');
                    userDiv.href = '/main/chat/direct/{{ i.id }}';
                    userDiv.className = 'block bg-gray-800 hover:bg-gray-750 rounded-lg p-4 border border-gray-700 hover:border-blue-500 transition group';
                    userDiv.innerHTML = `
                        <div class="flex items-center space-x-4">
                            <img src="{{ i.photo.url }}" alt="{{ i.username }}" class="w-16 h-16 rounded-full border-2 border-gray-700 group-hover:border-blue-500 transition">
                            <div class="flex-1">
                                <h3 class="font-semibold text-lg">{{ i.username }}</h3>
                                <p class="text-sm text-gray-400">Click to chat</p>
                            </div>
                            <svg class="w-6 h-6 text-gray-600 group-hover:text-blue-500 transition" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                            </svg>
                        </div>
                    `;
                    usersGrid.appendChild(userDiv);
                    {% endif %}
                {% endfor %}
                return;
            }
            
            fetch(`/main/search?q=${query}`)
                .then(response => response.json())
                .then(data => {
                    const usersGrid = document.getElementById('users-grid');
                    usersGrid.innerHTML = '';
                    
                    if (data.users.length === 0) {
                        usersGrid.innerHTML = `
                            <div class="col-span-full text-center py-12">
                                <svg class="w-16 h-16 mx-auto text-gray-600 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                                </svg>
                                <p class="text-gray-400 text-lg">No users found</p>
                            </div>
                        `;
                        return;
                    }
                    
                    data.users.forEach(user => {
                        const userDiv = document.createElement('a');
                        userDiv.href = `/main/chat/direct/${user.id}`;
                        userDiv.className = 'block bg-gray-800 hover:bg-gray-750 rounded-lg p-4 border border-gray-700 hover:border-blue-500 transition group';
                        userDiv.innerHTML = `
                            <div class="flex items-center space-x-4">
                                <img src="${user.photo_url}" alt="${user.username}" class="w-16 h-16 rounded-full border-2 border-gray-700 group-hover:border-blue-500 transition">
                                <div class="flex-1">
                                    <h3 class="font-semibold text-lg">${user.username}</h3>
                                    <p class="text-sm text-gray-400">Click to chat</p>
                                </div>
                                <svg class="w-6 h-6 text-gray-600 group-hover:text-blue-500 transition" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                                </svg>
                            </div>
                        `;
                        usersGrid.appendChild(userDiv);
                    });
                })
                .catch(error => console.error('Error searching users:', error));
        });
    </script>
</body>
</html>
