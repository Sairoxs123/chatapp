<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% for i in info %}
    <title>{{ i.username }}</title>
    <link href="{{ i.photo.url }}" rel="icon">
    {% endfor %}
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .message-bubble {
            max-width: 70%;
            word-wrap: break-word;
        }
        .scroll-container {
            scrollbar-width: thin;
            scrollbar-color: rgba(156, 163, 175, 0.5) transparent;
        }
        .scroll-container::-webkit-scrollbar {
            width: 6px;
        }
        .scroll-container::-webkit-scrollbar-track {
            background: transparent;
        }
        .scroll-container::-webkit-scrollbar-thumb {
            background-color: rgba(156, 163, 175, 0.5);
            border-radius: 3px;
        }
    </style>
</head>
<body class="bg-gray-900 text-white h-screen overflow-hidden">
    <div class="flex h-screen">
        <!-- Sidebar -->
        <div class="w-1/4 bg-gray-800 border-r border-gray-700 flex flex-col">
            <!-- User Info -->
            <div class="p-4 border-b border-gray-700">
                <div class="flex items-center justify-between">
                    <a href="{% url 'dashboard' %}" class="flex items-center space-x-3 hover:bg-gray-700 p-2 rounded-lg transition">
                        <img src="{{ url }}" alt="{{ username }}" class="w-10 h-10 rounded-full">
                        <span class="font-semibold text-lg">{{ username }}</span>
                    </a>
                    <a href="{% url 'logout' %}" class="text-red-400 hover:text-red-300 transition">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
                        </svg>
                    </a>
                </div>
            </div>

            <!-- Search -->
            <div class="p-4">
                <input type="search" id="search" placeholder="Search users..." 
                    class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg focus:outline-none focus:border-blue-500 transition">
            </div>

            <!-- Users List -->
            <div id="users-list" class="flex-1 overflow-y-auto scroll-container">
                {% for i in users %}
                    {% if i.username != username %}
                    <a href="/main/chat/direct/{{i.id}}" class="block hover:bg-gray-700 transition">
                        <div class="flex items-center space-x-3 p-4 border-b border-gray-700">
                            <img src="{{ i.photo.url }}" alt="{{ i.username }}" class="w-12 h-12 rounded-full">
                            <div>
                                <h3 class="font-semibold">{{ i.username }}</h3>
                            </div>
                        </div>
                    </a>
                    {% endif %}
                {% endfor %}
            </div>
        </div>

        <!-- Chat Area -->
        <div class="flex-1 flex flex-col">
            <!-- Chat Header -->
            <div class="bg-gray-800 border-b border-gray-700 p-4">
                <div class="flex items-center space-x-4">
                    {% for i in info %}
                    <img src="{{ i.photo.url }}" alt="{{ i.username }}" class="w-12 h-12 rounded-full">
                    <div>
                        <h2 class="text-xl font-semibold">{{ i.username }}</h2>
                        <p class="text-sm text-gray-400" id="status">Online</p>
                    </div>
                    {% endfor %}
                </div>
            </div>

            <!-- Messages Container -->
            <div id="messages" class="flex-1 overflow-y-auto scroll-container p-4 space-y-3">
                <!-- Messages will be inserted here -->
            </div>

            <!-- Message Input -->
            <div class="bg-gray-800 border-t border-gray-700 p-4">
                <div class="flex items-center space-x-3">
                    <button onclick="imageUpload()" class="p-2 bg-blue-600 hover:bg-blue-700 rounded-lg transition">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                        </svg>
                    </button>
                    <input type="text" id="message-input" placeholder="Type a message..." 
                        class="flex-1 px-4 py-3 bg-gray-700 border border-gray-600 rounded-lg focus:outline-none focus:border-blue-500 transition"
                        maxlength="1000">
                    <button onclick="sendMessage()" id="send-btn" class="px-6 py-3 bg-blue-600 hover:bg-blue-700 rounded-lg font-semibold transition">
                        Send
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Image Upload Modal -->
    <div id="image-modal" class="hidden fixed inset-0 bg-black bg-opacity-75 flex items-center justify-center z-50">
        <div class="bg-gray-800 rounded-lg p-6 max-w-md w-full mx-4">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-xl font-semibold">Send Image</h3>
                <button onclick="closeImageModal()" class="text-gray-400 hover:text-white">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>
            <input type="file" id="image-file" accept="image/*" class="mb-4 w-full text-sm text-gray-400
                file:mr-4 file:py-2 file:px-4
                file:rounded-lg file:border-0
                file:text-sm file:font-semibold
                file:bg-blue-600 file:text-white
                hover:file:bg-blue-700 file:cursor-pointer">
            <button onclick="sendImageMessage()" class="w-full px-4 py-2 bg-blue-600 hover:bg-blue-700 rounded-lg font-semibold transition">
                Send Image
            </button>
        </div>
    </div>

    <script>
        const username = "{{ username }}";
        const senderUsername = "{% for i in info %}{{ i.username }}{% endfor %}";
        const senderId = "{{ senderid }}";
        const roomName = [username, senderUsername].sort().join('_');
        
        // WebSocket connection
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsUrl = `${protocol}//${window.location.host}/ws/chat/${roomName}/`;
        let chatSocket = null;

        function connectWebSocket() {
            chatSocket = new WebSocket(wsUrl);

            chatSocket.onopen = function(e) {
                console.log('WebSocket connected');
                document.getElementById('status').textContent = 'Online';
                loadMessages();
            };

            chatSocket.onmessage = function(e) {
                const data = JSON.parse(e.data);
                
                if (data.type === 'message') {
                    appendMessage(data);
                    scrollToBottom();
                } else if (data.type === 'delete') {
                    removeMessage(data.message_id);
                }
            };

            chatSocket.onclose = function(e) {
                console.log('WebSocket disconnected');
                document.getElementById('status').textContent = 'Reconnecting...';
                setTimeout(connectWebSocket, 3000);
            };

            chatSocket.onerror = function(e) {
                console.error('WebSocket error:', e);
            };
        }

        function sendMessage() {
            const messageInput = document.getElementById('message-input');
            const message = messageInput.value.trim();
            
            if (message && chatSocket && chatSocket.readyState === WebSocket.OPEN) {
                const now = new Date();
                const date = `${now.getFullYear()}-${now.getMonth() + 1}-${now.getDate()}`;
                const time = `${now.getHours()}:${now.getMinutes()}:${now.getSeconds()}`;
                
                chatSocket.send(JSON.stringify({
                    'type': 'text_message',
                    'message': message,
                    'incoming': senderUsername,
                    'outgoing': username,
                    'date': date,
                    'time': time
                }));
                
                messageInput.value = '';
            }
        }

        function deleteMessage(messageId) {
            if (chatSocket && chatSocket.readyState === WebSocket.OPEN) {
                chatSocket.send(JSON.stringify({
                    'type': 'delete_message',
                    'message_id': messageId
                }));
            }
        }

        function appendMessage(data) {
            const messagesDiv = document.getElementById('messages');
            const isOwn = data.outgoing === username;
            
            const messageDiv = document.createElement('div');
            messageDiv.id = `message-${data.message_id}`;
            messageDiv.className = `flex ${isOwn ? 'justify-end' : 'justify-start'}`;
            
            const bubbleDiv = document.createElement('div');
            bubbleDiv.className = `message-bubble px-4 py-2 rounded-lg ${isOwn ? 'bg-blue-600' : 'bg-gray-700'}`;
            
            if (data.message_type === 'image' && data.image_url) {
                const img = document.createElement('img');
                img.src = data.image_url;
                img.className = 'rounded-lg max-w-xs';
                bubbleDiv.appendChild(img);
            } else {
                const text = document.createElement('span');
                text.textContent = data.message;
                text.className = 'break-words';
                bubbleDiv.appendChild(text);
            }
            
            if (isOwn) {
                const deleteBtn = document.createElement('button');
                deleteBtn.onclick = () => deleteMessage(data.message_id);
                deleteBtn.className = 'ml-2 text-xs text-gray-300 hover:text-white';
                deleteBtn.textContent = '×';
                bubbleDiv.appendChild(deleteBtn);
            }
            
            messageDiv.appendChild(bubbleDiv);
            messagesDiv.appendChild(messageDiv);
        }

        function removeMessage(messageId) {
            const messageDiv = document.getElementById(`message-${messageId}`);
            if (messageDiv) {
                messageDiv.remove();
            }
        }

        function loadMessages() {
            fetch(`/main/chat/fetch/${senderId}`)
                .then(response => response.json())
                .then(data => {
                    const messagesDiv = document.getElementById('messages');
                    messagesDiv.innerHTML = '';
                    
                    data.messages.forEach(msg => {
                        appendMessage({
                            message: msg.message,
                            message_id: msg.id,
                            outgoing: msg.outgoing,
                            message_type: msg.type,
                            image_url: msg.image_url
                        });
                    });
                    
                    scrollToBottom();
                })
                .catch(error => console.error('Error loading messages:', error));
        }

        function scrollToBottom() {
            const messagesDiv = document.getElementById('messages');
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function imageUpload() {
            document.getElementById('image-modal').classList.remove('hidden');
        }

        function closeImageModal() {
            document.getElementById('image-modal').classList.add('hidden');
        }

        function sendImageMessage() {
            const fileInput = document.getElementById('image-file');
            const file = fileInput.files[0];
            
            if (file) {
                const formData = new FormData();
                formData.append('image', file);
                formData.append('incoming', senderUsername);
                formData.append('outgoing', username);
                formData.append('type', 'image');
                formData.append('message', '');
                formData.append('userid', senderId);
                
                const now = new Date();
                formData.append('date', `${now.getFullYear()}-${now.getMonth() + 1}-${now.getDate()}`);
                formData.append('time', `${now.getHours()}:${now.getMinutes()}:${now.getSeconds()}`);
                
                fetch('/main/chat/sendimage', {
                    method: 'POST',
                    body: formData
                })
                .then(response => response.json())
                .then(data => {
                    closeImageModal();
                    fileInput.value = '';
                    loadMessages();
                })
                .catch(error => console.error('Error uploading image:', error));
            }
        }

        // Search functionality
        document.getElementById('search').addEventListener('input', function(e) {
            const query = e.target.value;
            
            fetch(`/main/search?q=${query}`)
                .then(response => response.json())
                .then(data => {
                    const usersList = document.getElementById('users-list');
                    usersList.innerHTML = '';
                    
                    data.users.forEach(user => {
                        const userDiv = document.createElement('a');
                        userDiv.href = `/main/chat/direct/${user.id}`;
                        userDiv.className = 'block hover:bg-gray-700 transition';
                        userDiv.innerHTML = `
                            <div class="flex items-center space-x-3 p-4 border-b border-gray-700">
                                <img src="${user.photo_url}" alt="${user.username}" class="w-12 h-12 rounded-full">
                                <div>
                                    <h3 class="font-semibold">${user.username}</h3>
                                </div>
                            </div>
                        `;
                        usersList.appendChild(userDiv);
                    });
                })
                .catch(error => console.error('Error searching users:', error));
        });

        // Enter key to send message
        document.getElementById('message-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        // Initialize WebSocket connection
        connectWebSocket();
    </script>
</body>
</html>
